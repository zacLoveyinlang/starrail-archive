<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="星穹全典：崩坏：星穹铁道角色、技能、数值、语音与剧情台词的离线可检索档案。">
  <title>星穹全典 · Star Rail Codex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/home" aria-label="星穹全典首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 3l2.9 9.1L28 9.4l-7 5.4 2.7 9.2-7.7-4.9-7.7 4.9L11 14.8 4 9.4l9.1-.3z"/><circle cx="16" cy="16" r="2.2"/></svg>
      </span>
      <span class="brand-text"><b>星穹全典</b><small>STAR RAIL CODEX</small></span>
    </a>
    <nav class="desktop-nav" aria-label="主导航">
      <a href="#/home" data-nav="home">总览</a>
      <a href="#/characters" data-nav="characters">角色</a>
      <a href="#/stories" data-nav="stories">剧情</a>
      <a href="#/about" data-nav="about">说明</a>
    </nav>
    <div class="top-actions">
      <button class="icon-button install-button" id="install-button" hidden aria-label="安装到设备">
        <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0l4-4m-4 4l-4-4M5 19h14"/></svg>
      </button>
      <button class="search-trigger" id="search-trigger" aria-label="打开全库搜索">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <span>搜索全典</span>
        <kbd>/</kbd>
      </button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <div class="boot-screen">
      <div class="boot-star" aria-hidden="true"></div>
      <p>正在展开星图档案…</p>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="移动端导航">
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>总览</span></a>
    <a href="#/characters" data-nav="characters"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 21c0-4 2.4-6.4 6-6.4s6 2.4 6 6.4M16 5.5c2.4 0 4.4 1.8 4.4 4.2s-2 4.2-4.4 4.2"/></svg><span>角色</span></a>
    <a href="#/stories" data-nav="stories"><svg viewBox="0 0 24 24"><path d="M4 4.5h6.5c1.4 0 1.5 1 1.5 2v14c0-1-.5-2-2-2H4zM20 4.5h-6.5c-1.4 0-1.5 1-1.5 2v14c0-1 .5-2 2-2H20z"/></svg><span>剧情</span></a>
    <a href="#/about" data-nav="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.4v.2"/></svg><span>说明</span></a>
  </nav>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-backdrop" data-close-search></div>
    <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <header class="search-head">
        <h2 id="search-title" class="sr-only">全库搜索</h2>
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="角色、任务、某一句台词…" aria-label="搜索关键词">
          <button class="search-close" data-close-search aria-label="关闭搜索">Esc</button>
        </div>
        <div class="search-modes" role="tablist">
          <button class="active" data-search-mode="entries" role="tab">词条</button>
          <button data-search-mode="lines" role="tab">全库台词 <span id="line-index-state">按需载入</span></button>
        </div>
      </header>
      <div class="search-body" id="search-results">
        <div class="search-empty">
          <span class="search-orbit" aria-hidden="true"></span>
          <p>输入关键词，开始检索这座档案库。</p>
          <small>词条模式检索角色与任务；台词模式会在首次使用时载入约 9 万句剧情文本（含分支）。</small>
        </div>
      </div>
    </section>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" data-close-lightbox aria-label="关闭图片">×</button>
    <img id="lightbox-image" alt="">
    <p id="lightbox-caption"></p>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
